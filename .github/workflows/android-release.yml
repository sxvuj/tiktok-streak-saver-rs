name: Android Build and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # 16 KB ELF page alignment for Android 15/16. Set here as well as in .cargo/config.toml
  # because cargo-ndk can override per-target rustflags from config files.
  ALIGN_FLAGS: "-C link-arg=-Wl,-z,max-page-size=16384"

jobs:
  rust-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy gate
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --workspace
      - name: Replay rust-anything parity cases
        run: cargo run -p streak-saver-cli -- parity-verify --cases rust-anything/cases.jsonl

  android-apk:
    needs: rust-gate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Read app version
        id: version
        run: |
          VERSION="$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' android/app/build.gradle.kts | head -n1)"
          CARGO_VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          test -n "$VERSION" || { echo "::error::versionName not found"; exit 1; }
          if [ "$VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::versionName ($VERSION) and Cargo workspace version ($CARGO_VERSION) differ"; exit 1
          fi
          # A release tag must match the app version, e.g. tag v1.0.0 for versionName 1.0.0.
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match app version v${VERSION}"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "App version: $VERSION"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # AGP 8.7.x needs Gradle 8.9 to 8.x. Pin it instead of relying on the runner image.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Resolve Android NDK
        run: |
          NDK="${ANDROID_NDK_HOME:-$ANDROID_NDK_LATEST_HOME}"
          test -d "$NDK" || { echo "No NDK found on runner"; exit 1; }
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "Using NDK at $NDK"

      - name: Build 16KB-aligned JNI libraries
        env:
          RUSTFLAGS: ${{ env.ALIGN_FLAGS }}
        run: |
          cargo ndk \
            -t arm64-v8a \
            -t armeabi-v7a \
            -t x86_64 \
            -o android/app/src/main/jniLibs \
            build --release -p streak-saver-jni

      - name: Verify 16KB alignment of native libs
        run: |
          READELF="$(find "$ANDROID_NDK_HOME" -name llvm-readelf -type f | head -n1)"
          fail=0
          for so in android/app/src/main/jniLibs/*/libstreak_saver_jni.so; do
            abi="$(basename "$(dirname "$so")")"
            # 32-bit armeabi-v7a is exempt from the 16 KB requirement; report only.
            aligns="$("$READELF" -lW "$so" | awk '$1=="LOAD"{print $NF}' | sort -u | tr '\n' ' ')"
            echo "$abi LOAD align: $aligns"
            if [ "$abi" != "armeabi-v7a" ] && echo "$aligns" | grep -qE '0x1000( |$)'; then
              echo "::error::$abi is only 4 KB aligned"; fail=1
            fi
          done
          exit $fail

      # Uses the repository secrets when they exist. Without them a throwaway key is generated,
      # which still gives an installable APK, but every build then has a different signature,
      # so Android will refuse to update over an older install. See README, "Release signing".
      - name: Prepare release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/release.jks"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
            STORE_PASS="$SECRET_KEYSTORE_PASSWORD"
            ALIAS="$SECRET_KEY_ALIAS"
            KEY_PASS="$SECRET_KEY_PASSWORD"
            echo "Signing with the keystore from repository secrets."
          else
            echo "::warning::No signing secrets configured. Using a throwaway key; this APK cannot update an install signed with a different key."
            STORE_PASS="$(openssl rand -hex 16)"
            KEY_PASS="$STORE_PASS"
            ALIAS="streaksaver"
            keytool -genkeypair -keystore "$KS" -storetype PKCS12 \
              -alias "$ALIAS" -keyalg RSA -keysize 4096 -validity 36500 \
              -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
              -dname "CN=Streak Saver RS, O=sxvuj"
          fi
          echo "::add-mask::$STORE_PASS"
          echo "::add-mask::$KEY_PASS"
          {
            echo "KEYSTORE_PATH=$KS"
            echo "KEYSTORE_PASSWORD=$STORE_PASS"
            echo "KEY_ALIAS=$ALIAS"
            echo "KEY_PASSWORD=$KEY_PASS"
          } >> "$GITHUB_ENV"

      - name: Assemble signed Release APK
        working-directory: android
        run: gradle assembleRelease --stacktrace

      - name: Verify signature and name the APK
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          SRC="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$SRC" || { echo "::error::Release APK not found at $SRC"; ls -R android/app/build/outputs || true; exit 1; }
          APKSIGNER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name apksigner -type f | sort -V | tail -n1)"
          "$APKSIGNER" verify --verbose --print-certs "$SRC"
          mkdir -p dist
          cp "$SRC" "dist/StreakSaver-RS-v${VERSION}.apk"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: StreakSaver-RS-release-apk
          path: dist/*.apk
          if-no-files-found: error

  publish-release:
    # Only for version tags (v1.0.0, v1.1.0, ...): attaches the APK to the GitHub Releases page.
    if: github.ref_type == 'tag'
    needs: android-apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: StreakSaver-RS-release-apk
          path: dist
      - name: Extract release notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.android-apk.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[?" v "\\]?" { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Release v${VERSION}" > release-notes.md
          fi
          cat release-notes.md
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Streak Saver RS v${{ needs.android-apk.outputs.version }}
          body_path: release-notes.md
          files: dist/*.apk
          fail_on_unmatched_files: true
