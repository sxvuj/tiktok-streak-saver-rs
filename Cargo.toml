[workspace]
resolver = "2"
members = [
    "crates/streak-saver-core",
    "crates/streak-saver-jni",
    "crates/streak-saver-cli",
]

[workspace.package]
version = "1.1.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/sxvuj/tiktok-streak-saver-rs"
authors = ["sxvuj", "Jon2G (original TiktokStreakSaver)"]

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
jni = "0.21"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
url = "2.5"
clap = { version = "4.5", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
strip = "symbols"
